
# Автозапуск софта (СТРОГО ОДИН РАЗ)
exec-once = waybar
exec-once = awww-daemon && awww restore
exec-once = ~/.config/hypr/scripts/wall_loop.sh

# =====================================================================
# 🖥️ ДИСПЛЕЙ FIREBAT U6C (2.5K @ 120Hz)
# =====================================================================
monitor=eDP-1, 2560x1600@120, 0x0, 1.25

# =====================================================================
# ⌨️ РАСКЛАДКА КЛАВИАТУРЫ И ЯЗЫК (Переключение по Alt + Shift)
# =====================================================================
input {
    kb_layout = us,ru
    kb_options = grp:alt_shift_toggle,grp:win_space_toggle
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

# =====================================================================
# 🚀 CORE APPLICATIONS (Твоя раскладка из Space Retro)
# =====================================================================
$terminal = kitty
$menu = fuzzel
$browser = zen-browser

bind = SUPER SHIFT, P, exec, hyprpicker
bind = SUPER, Return, exec, $terminal
bind = SUPER, Q, killactive,
bind = SUPER, D, exec, $menu
bind = SUPER, N, exec, $browser
# bind = SUPER, E, exec, kitty --class floating_tui -e yazi
bind = SUPER, E, exec, kitty yazi
bind = CTRL ALT, W, exec, ~/.config/hypr/scripts/wall.sh
bind =  SUPER CTRL SHIFT, R, exec, killall waybar
bind =  SUPER SHIFT, R, exec, waybar
bind = CTRL ALT, Delete, exit,

# =====================================================================
# 🔋 ФИЗИЧЕСКИЕ КНОПКИ НОУТБУКА (Звук, Яркость, Скриншоты)
# =====================================================================
binde = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

binde = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
binde = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

bind = , Print, exec, grimblast copysave screen ~/Pictures/Screenshots/screenshot.png
# Выделение области -> сохранение в ~/Pictures/Screenshots -> копия в буфер
bind = SUPER SHIFT, S, exec, mkdir -p ~/Pictures/Screenshots && grim -g "$(slurp)" - | tee ~/Pictures/Screenshots/$(date +'%Y-%m-%d_%H-%M-%S').png | wl-copy
# Нажал Ctrl+Alt+R — началась запись области, нажал еще раз — остановилась
bind = ctrl alt, Print, exec, bash -c 'pkill -x wf-recorder || (mkdir -p ~/Videos && wf-recorder -a -f ~/Videos/Запись_$(date +'%Y-%m-%d_%H-%M-%S').mp4)'

# =====================================================================
# 🛠️ СЕТЬ И БЛЮТУЗ В ПЛАВАЮЩИХ ОКНАХ
# =====================================================================
# windowrule = match:class ^(floating_tui)$, float on, center on, size 700 450
windowrule = match:class ^(floating_tui)$, float on, center on, size 1100 700


bind = SUPER, B, exec, kitty --class floating_tui -e bluetui
bind = SUPER, W, exec, kitty --class floating_tui -e wlctl
bind = SUPER, A, exec, kitty --class floating_tui -e pulsemixer
#-e nmtui

# =====================================================================
# ✨ МИНИМАЛИСТИЧНЫЙ ВИЗУАЛ
# =====================================================================
general {
    # Расстояние МЕЖДУ соседними окнами (в пикселях)
    gaps_in = 6

    # Расстояние между окнами и КРАЯМИ экрана (монитора)
    gaps_out = 12

    # Твои остальные настройки бордеров ниже...
    border_size = 2
    # col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    # col.inactive_border = rgba(595959aa)
}

decoration {
    rounding = 16

    blur {
        enabled = true
        size = 5
        passes = 3
    }
}

bind = SUPER SHIFT, F, fullscreen,
bind = SUPER ALT, F, togglefloating,
bind = SUPER, G, togglegroup,

# # Example special workspace (scratchpad)
# bind = SUPER, S, togglespecialworkspace, magic
# bind = SUPER SHIFT, S, movetoworkspace, special:magic
#
# Специальный воркспейс (Scratchpad)
bind = SUPER, U, togglespecialworkspace,
bind = SUPER SHIFT, U, movetoworkspace, special

# Навигация (Фокус)
bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d
bind = ALT, Tab, movefocus, d

# Перемещение окон (Move)
bind = SUPER CTRL, left, movewindow, l
bind = SUPER CTRL, right, movewindow, r
bind = SUPER CTRL, up, movewindow, u
bind = SUPER CTRL, down, movewindow, d

# Ресайз (Resize)
bind = SUPER SHIFT, left, resizeactive, -40 0
bind = SUPER SHIFT, right, resizeactive, 40 0
bind = SUPER SHIFT, up, resizeactive, 0 -40
bind = SUPER SHIFT, down, resizeactive, 0 40

# Scroll through existing workspaces with mainMod + scroll
bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

; bind = SUPER, Tab, workspace, e+1
; bind = SUPER SHIFT, Tab, workspace, e-1
binds {
    # Разрешает Hyprland запоминать историю воркспейсов для прыжков назад-вперед
    allow_workspace_cycles = true
}
# Переключение на самый последний активный рабочий стол (туда-сюда между 3 и 7, например)
bind = SUPER, Tab, workspace, previous

# =====================================================================
# 🗂️ РАБОЧИЕ СТОЛЫ (Твоя раскладка из Space Retro)
# =====================================================================
# Переключение на воркспейсы по SUPER + [1-9]
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9

# Перемещение активного окна на воркспейс по SUPER + SHIFT + [1-9]
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
